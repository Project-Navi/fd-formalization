name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: lean-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  ELAN_HOME: /home/runner/.elan

jobs:
  # CONTRACT: org ruleset requires this exact check name 'build'
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install elan and toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/917c18d0ad52f649c2603dc8b973f5b9fa5f8f43/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "${ELAN_HOME}/bin" >> "${GITHUB_PATH}"
          export PATH="${ELAN_HOME}/bin:${PATH}"
          elan --version
          elan show

      # Dependencies only, keyed on the pinned state; project modules are always rebuilt.
      - name: Cache Lake packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: lake-packages-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}

      - name: Get Mathlib cache
        run: lake exe cache get || true

      # Every tracked module, including any not imported by FdFormal.lean.
      - name: Build (fail on warnings, including sorry)
        run: lake build --wfail FdFormal $(git ls-files 'FdFormal/*.lean' | sed -e 's/\.lean$//' -e 's#/#.#g' -e 's/^/+/')

      - name: Lint (Mathlib environment linters)
        run: lake lint

      - name: Check axioms
        shell: bash
        run: |
          lake env lean -DwarningAsError=true FdFormal/Verify.lean 2>&1 | tee "$RUNNER_TEMP/axioms.txt"
          expected=$(awk '/^#print axioms /{ n++ } END { print n + 0 }' FdFormal/Verify.lean)
          # Rejoin wrapped axiom lists, then check every record against the allowlist.
          sed -e ':a' -e 'N' -e '$!ba' -e 's/\n / /g' "$RUNNER_TEMP/axioms.txt" > "$RUNNER_TEMP/records.txt"
          found=$(awk '/ (depends on axioms: \[.*\]|does not depend on any axioms)$/{ n++ } END { print n + 0 }' "$RUNNER_TEMP/records.txt")
          unexpected=$(sed -n 's/.* depends on axioms: \[\(.*\)\]$/\1/p' "$RUNNER_TEMP/records.txt" | tr ',' '\n' | tr -d ' ' \
            | awk '!/^(propext|Classical\.choice|Quot\.sound)$/' | sort -u | tr '\n' ' ')
          if [ "$expected" -eq 0 ] || [ "$found" -ne "$expected" ] || [ -n "$unexpected" ]; then
            echo "::error::axiom check failed: $found of $expected records; unexpected axioms: ${unexpected:-none}"
            exit 1
          fi
          echo "$found of $expected declarations use only propext, Classical.choice and Quot.sound."
